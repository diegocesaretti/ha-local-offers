name: "Ofertas Locales"
description: "Detecta catálogos de supermercados, extrae ofertas con LLM Vision y las integra con Home Assistant."
version: "0.1.1"
slug: "local_offers"
startup: application
boot: auto
init: false
arch:
  - aarch64
  - amd64
ingress: true
ingress_port: 8099
panel_icon: mdi:tag-multiple
panel_title: Ofertas
panel_admin: false
homeassistant_api: true
stage: experimental
options:
  check_interval_hours: 12
  scan_on_start: false
  almacor_url: "https://almacor.com.ar/catalogo/mailing.pdf"
  heyzine_url: "https://heyzine.com/flip-book/fafe2791cf.html"
  vision_enabled: false
  vision_api_base: "https://api.openai.com/v1"
  vision_api_key: ""
  vision_model: "gpt-4.1-mini"
  image_mode: "full"
  render_dpi: 170
  jpeg_quality: 88
  max_pages: 40
  notify_event: true
schema:
  check_interval_hours: "int(1,168)"
  scan_on_start: bool
  almacor_url: url
  heyzine_url: url
  vision_enabled: bool
  vision_api_base: str
  vision_api_key: password
  vision_model: str
  image_mode: "list(full|quarters)"
  render_dpi: "int(100,240)"
  jpeg_quality: "int(60,95)"
  max_pages: "int(1,100)"
  notify_event: bool
