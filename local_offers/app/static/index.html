<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ofertas Locales</title>
<style>
:root { color-scheme: light dark; --bg:#0f1115; --card:#181b22; --muted:#9aa3b2; --line:#2a2f3a; --accent:#65b5ff; --ok:#65d28e; --err:#ff7373; }
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:#f5f7fa}
main{max-width:1180px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:1.55rem;margin:0}.muted{color:var(--muted)}button,input,select{font:inherit;border:1px solid var(--line);border-radius:10px;background:#11151b;color:inherit;padding:10px 12px}
button{cursor:pointer;background:#1c2734;border-color:#2a475f}button:disabled{opacity:.55;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.stat{font-size:1.8rem;font-weight:700}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar input{min-width:260px;flex:1}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:.82rem;color:var(--muted)}
.price{font-weight:800;font-size:1.05rem}.promo{color:#ffd27a}.good{color:var(--ok)}.bad{color:var(--err)}a{color:var(--accent)}.pill{display:inline-block;padding:3px 8px;border:1px solid var(--line);border-radius:999px;font-size:.78rem}.catalogs{display:grid;gap:8px}.small{font-size:.84rem}.test-result{margin-top:10px;white-space:pre-wrap;word-break:break-word}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)} table{font-size:.9rem} th:nth-child(3),td:nth-child(3){display:none}}
</style>
</head>
<body><main>
<div class="top"><div><h1>🏷️ Ofertas Locales</h1><div class="muted small" id="subtitle">Almacor + Heyzine · LLM Vision</div></div><div><button id="testBtn" onclick="testVision()">Probar API LLM</button> <button id="scanBtn" onclick="scan(false)">Escanear ahora</button> <button onclick="scan(true)" title="Vuelve a analizar aunque el PDF ya exista">Reanalizar</button></div></div>
<div class="grid"><div class="card"><div class="muted small">Ofertas guardadas</div><div class="stat" id="offers">–</div></div><div class="card"><div class="muted small">Catálogos</div><div class="stat" id="catalogsCount">–</div></div><div class="card"><div class="muted small">Almacor</div><div class="stat" id="almacor">–</div></div><div class="card"><div class="muted small">Heyzine</div><div class="stat" id="heyzine">–</div></div></div>
<div class="card"><div class="top"><strong>Estado</strong><span class="pill" id="runState">cargando…</span></div><div class="muted small" id="configState"></div><div id="testResult" class="small test-result"></div><div id="lastResult" class="small" style="margin-top:8px"></div></div>
<div class="toolbar"><input id="search" placeholder="Buscar Coca-Cola, yerba, aceite…" oninput="debouncedLoad()"><select id="source" onchange="loadOffers()"><option value="">Todas las tiendas</option><option>Almacor</option><option>Heyzine</option></select></div>
<div style="overflow:auto"><table><thead><tr><th>Producto</th><th>Precio</th><th>Presentación</th><th>Promo</th><th>Tienda / página</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="muted">Todavía no hay datos.</td></tr></tbody></table></div>
<h3>Catálogos recientes</h3><div class="catalogs" id="catalogList"></div>
</main>
<script>
const rel = p => p.replace(/^\//,'');
const money = n => (n===null || n===undefined) ? '—' : new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n);
const esc = s => String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const intervalLabel = h => h===168 ? '7 días' : (h%24===0 ? `${h/24} días` : `${h} h`);
let timer;
function debouncedLoad(){clearTimeout(timer);timer=setTimeout(loadOffers,250)}
async function loadStatus(){const s=await (await fetch(rel('api/status'))).json();document.getElementById('offers').textContent=s.stats.offers;document.getElementById('catalogsCount').textContent=s.stats.catalogs;document.getElementById('almacor').textContent=s.stats.by_source?.Almacor??0;document.getElementById('heyzine').textContent=s.stats.by_source?.Heyzine??0;document.getElementById('runState').textContent=s.running?'Escaneando':'Listo';document.getElementById('runState').className='pill '+(s.running?'promo':'good');document.getElementById('scanBtn').disabled=s.running;document.getElementById('configState').textContent=`Cada ${intervalLabel(s.config.check_interval_hours)} · Vision ${s.config.vision_enabled?'ON':'OFF'} · ${s.config.vision_model} · delay ${s.config.llm_delay_seconds}s · reintentos ${s.config.llm_max_retries} · API key ${s.config.api_key_configured?'configurada':'NO configurada'}`;renderCatalogs(s.catalogs);if(s.last_result)document.getElementById('lastResult').textContent=JSON.stringify(s.last_result.sources);}
async function loadOffers(){const q=document.getElementById('search').value.trim();const source=document.getElementById('source').value;const p=new URLSearchParams();if(q)p.set('q',q);if(source)p.set('source',source);const d=await (await fetch(rel('api/offers')+'?'+p)).json();const rows=document.getElementById('rows');if(!d.items.length){rows.innerHTML='<tr><td colspan="5" class="muted">Sin resultados.</td></tr>';return;}rows.innerHTML=d.items.map(x=>`<tr><td><strong>${esc([x.brand,x.name].filter(Boolean).join(' '))}</strong><div class="muted small">${esc(x.variant||'')}</div></td><td class="price">${money(x.price)}${x.previous_price?`<div class="muted small"><s>${money(x.previous_price)}</s></div>`:''}</td><td>${esc(x.presentation||'—')}</td><td class="promo">${esc(x.promotion_text||'—')}</td><td><span class="pill">${esc(x.source)}</span><div class="muted small">pág. ${x.page||'?'}</div><a class="small" href="${rel('api/catalog/'+x.catalog_id+'/pdf')}" target="_blank">ver PDF</a></td></tr>`).join('');}
function renderCatalogs(items){const el=document.getElementById('catalogList');if(!items.length){el.innerHTML='<div class="muted">Sin catálogos todavía.</div>';return}el.innerHTML=items.map(c=>`<div class="card small"><div class="top"><strong>${esc(c.source)} · ${esc(c.title||'Catálogo')}</strong><span class="pill ${c.status==='ready'?'good':c.status==='error'?'bad':''}">${esc(c.status)}</span></div><div class="muted">${esc(c.valid_from||'?')} → ${esc(c.valid_until||'?')} · ${c.page_count||'?'} páginas</div>${c.error?`<div class="bad">${esc(c.error)}</div>`:''}</div>`).join('')}
async function testVision(){const b=document.getElementById('testBtn');const el=document.getElementById('testResult');b.disabled=true;b.textContent='Probando…';el.className='small test-result muted';el.textContent='Probando endpoint, API key, modelo y entrada de imagen…';try{const r=await fetch(rel('api/test-vision'),{method:'POST'});const d=await r.json();if(d.ok){el.className='small test-result good';el.textContent=`✓ API LLM OK · ${d.model}\n${d.endpoint}\n${d.response||''}`;}else{el.className='small test-result bad';el.textContent='✗ '+(d.error||'Error desconocido');}}catch(e){el.className='small test-result bad';el.textContent='✗ '+e;}finally{b.disabled=false;b.textContent='Probar API LLM';}}
async function scan(force){const b=document.getElementById('scanBtn');b.disabled=true;b.textContent='Escaneando…';try{await fetch(rel('api/scan')+(force?'?force=true':''),{method:'POST'});}finally{b.textContent='Escanear ahora';await loadStatus();await loadOffers();}}
loadStatus();loadOffers();setInterval(loadStatus,5000);
</script></body></html>
