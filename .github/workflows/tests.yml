name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: local_offers/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r local_offers/requirements.txt
          pip install pytest
      - name: Compile
        working-directory: local_offers
        run: python -m compileall -q app tests
      - name: Test
        working-directory: local_offers
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: ANMAT Excel live smoke
        continue-on-error: true
        working-directory: local_offers
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import asyncio
          from pathlib import Path
          from app import db
          from app.config import Settings
          import app.anmat_excel as ae
          db.DB_PATH = Path('/tmp/anmat-smoke.db')
          ae.ROOT = Path('/tmp/anmat-data')
          ae.DATASET = ae.ROOT / 'lialg-current.bin'
          db.init_db()
          result = asyncio.run(ae.get_dataset(Settings(anmat_refresh_hours=1), force=True))
          print({k: (len(v) if k == 'rows' else v) for k, v in result.items()})
          if not result.get('ok'):
              raise SystemExit(2)
          PY
