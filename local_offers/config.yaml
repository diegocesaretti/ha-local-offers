name: "Ofertas Locales"
description: "Detecta catálogos de supermercados, extrae ofertas con LLM Vision y las integra con Home Assistant."
version: "0.3.2"
slug: "local_offers"
startup: application
boot: auto
init: false
arch:
  - aarch64
  - amd64
ingress: true
ingress_port: 8099
panel_icon: mdi:tag-multiple
panel_title: Ofertas
panel_admin: false
homeassistant_api: true
stage: experimental
options:
  check_interval_hours: 168
  scan_on_start: false
  almacor_url: "https://almacor.com.ar/catalogo/mailing.pdf"
  caracol_home_url: "https://www.supercaracol.com.ar/"
  heyzine_url: ""
  vision_enabled: false
  vision_api_base: "https://generativelanguage.googleapis.com/v1beta/openai"
  vision_api_key: ""
  vision_model: "gemini-3.6-flash"
  vision_backup_enabled: false
  vision_backup_api_base: "https://openrouter.ai/api/v1"
  vision_backup_api_key: ""
  vision_backup_model: ""
  anmat_enabled: true
  anmat_url: "https://listadoalg.anmat.gob.ar/Home"
  anmat_match_threshold: 0.82
  anmat_refresh_hours: 12
  anmat_cache_days: 7
  anmat_delay_seconds: 0.5
  anmat_timeout_seconds: 30
  image_mode: "full"
  render_dpi: 170
  jpeg_quality: 88
  max_pages: 40
  cleanup_enabled: true
  keep_pdfs_per_source: 1
  llm_delay_seconds: 2
  llm_max_retries: 3
  llm_retry_backoff_seconds: 5
  notify_event: true
schema:
  check_interval_hours: "int(1,168)"
  scan_on_start: bool
  almacor_url: url
  caracol_home_url: url
  heyzine_url: str
  vision_enabled: bool
  vision_api_base: str
  vision_api_key: password
  vision_model: str
  vision_backup_enabled: bool
  vision_backup_api_base: str
  vision_backup_api_key: password
  vision_backup_model: str
  anmat_enabled: bool
  anmat_url: url
  anmat_match_threshold: float
  anmat_refresh_hours: "int(1,168)"
  anmat_cache_days: "int(1,30)"
  anmat_delay_seconds: float
  anmat_timeout_seconds: float
  image_mode: "list(full|quarters)"
  render_dpi: "int(100,240)"
  jpeg_quality: "int(60,95)"
  max_pages: "int(1,100)"
  cleanup_enabled: bool
  keep_pdfs_per_source: "int(0,5)"
  llm_delay_seconds: "int(0,120)"
  llm_max_retries: "int(0,10)"
  llm_retry_backoff_seconds: "int(1,120)"
  notify_event: bool
