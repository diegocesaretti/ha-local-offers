name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: local_offers/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r local_offers/requirements.txt
          pip install pytest
      - name: Compile
        working-directory: local_offers
        run: python -m compileall -q app tests
      - name: Test
        working-directory: local_offers
        run: pytest -q
